name: CI Build & Integration Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-linux:
    name: Build & Test Linux (64-bit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build with Shell Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Download Chinook SQLite Test Database
        run: |
          curl -sSL -o Chinook_Sqlite.sqlite https://github.com/lerocha/chinook-database/releases/download/v1.4.5/Chinook_Sqlite.sqlite

      - name: Run Integration Tests on Chinook Database (Shell Build)
        env:
          SQLITE_DB_PATH: ${{ github.workspace }}/Chinook_Sqlite.sqlite
        run: |
          ./bin/mcp_test_runner ./bin/sqlite-mcp-server

      - name: Build with CMake (Release)
        run: |
          mkdir build-cmake
          cd build-cmake
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Run Integration Tests on Chinook Database (CMake Build)
        env:
          SQLITE_DB_PATH: ${{ github.workspace }}/Chinook_Sqlite.sqlite
        run: |
          ./build-cmake/mcp_test_runner ./build-cmake/sqlite-mcp-server

  build-windows:
    name: Build & Test Windows (64-bit MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Batch Script (Release)
        run: ./build.bat

      - name: Download Chinook SQLite Test Database
        run: |
          curl.exe -sSL -o Chinook_Sqlite.sqlite https://github.com/lerocha/chinook-database/releases/download/v1.4.5/Chinook_Sqlite.sqlite

      - name: Run Integration Tests on Chinook Database (Batch Build)
        env:
          SQLITE_DB_PATH: ${{ github.workspace }}/Chinook_Sqlite.sqlite
        run: bin\mcp_test_runner.exe bin\sqlite-mcp-server.exe

      - name: Build with CMake (Release)
        run: |
          mkdir build-cmake
          cd build-cmake
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release

      - name: Run Integration Tests on Chinook Database (CMake Release)
        env:
          SQLITE_DB_PATH: ${{ github.workspace }}/Chinook_Sqlite.sqlite
        run: |
          .\build-cmake\Release\mcp_test_runner.exe .\build-cmake\Release\sqlite-mcp-server.exe

      - name: Build with CMake (Debug - Build Only)
        run: |
          mkdir build-cmake-debug
          cd build-cmake-debug
          cmake -DCMAKE_BUILD_TYPE=Debug ..
          cmake --build . --config Debug
