name: CI Build & Integration Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-linux:
    name: Build & Test Linux (64-bit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test with Shell Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build and Test with CMake (Release)
        run: |
          mkdir build-cmake
          cd build-cmake
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .
          ./mcp_test_runner ./sqlite-mcp-server

  build-windows:
    name: Build & Test Windows (64-bit MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and Test with Batch Script (Release)
        run: ./build.bat

      - name: Build and Test with CMake (Release)
        run: |
          mkdir build-cmake
          cd build-cmake
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release
          .\Release\mcp_test_runner.exe .\Release\sqlite-mcp-server.exe
      - name: Run Integration Tests on Chinook Database (CMake Release)

      - name: Build with CMake (Debug - Build Only)
        run: |
          mkdir build-cmake-debug
          cd build-cmake-debug
          cmake -DCMAKE_BUILD_TYPE=Debug ..
          cmake --build . --config Debug
