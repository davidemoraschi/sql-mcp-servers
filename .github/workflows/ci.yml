name: CI Build & Integration Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-linux:
    name: Build & Test Linux (64-bit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config postgresql

      - name: Configure PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE testdb;"

      - name: Build with Shell Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Download Chinook SQLite Test Database
        run: |
          curl -sSL -o Chinook_Sqlite.sqlite https://github.com/lerocha/chinook-database/releases/download/v1.4.5/Chinook_Sqlite.sqlite

      - name: Run SQLite Integration Tests (Shell Build)
        env:
          SQLITE_DB_PATH: ${{ github.workspace }}/Chinook_Sqlite.sqlite
        run: ./bin/mcp_test_runner_sqlite ./bin/sqlite-mcp-server

      - name: Run PostgreSQL Integration Tests (Shell Build)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: testdb
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./bin/mcp_test_runner_postgres ./bin/postgres-mcp-server

      - name: Build with CMake (Release)
        run: |
          mkdir build-cmake
          cd build-cmake
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Run SQLite Integration Tests (CMake Build)
        env:
          SQLITE_DB_PATH: ${{ github.workspace }}/Chinook_Sqlite.sqlite
        run: ./build-cmake/mcp_test_runner_sqlite ./build-cmake/sqlite-mcp-server

      - name: Run PostgreSQL Integration Tests (CMake Build)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: testdb
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./build-cmake/mcp_test_runner_postgres ./build-cmake/postgres-mcp-server

  build-windows:
    name: Build & Test Windows (64-bit MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure PostgreSQL
        run: |
          $pgBin = (Get-Item "C:\Program Files\PostgreSQL\*\bin" | Sort-Object Name -Descending | Select-Object -First 1).FullName
          Write-Host "pg bin: $pgBin"
          $svc = Get-WmiObject Win32_Service | Where-Object { $_.Name -like 'postgresql*' } | Select-Object -First 1
          if ($svc) {
            if ($svc.PathName -match '-D\s+"([^"]+)"') { $pgData = $Matches[1] }
            elseif ($svc.PathName -match "-D\s+(\S+)")  { $pgData = $Matches[1] }
          }
          if (-not $pgData -or -not (Test-Path $pgData)) {
            $pgData = @("C:\Program Files\PostgreSQL\17\data","C:\Program Files\PostgreSQL\16\data","C:\Program Files\PostgreSQL\15\data") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          Write-Host "pg data: $pgData"
          $hba = "$pgData\pg_hba.conf"
          (Get-Content $hba) -replace '(host\s+all\s+all\s+\S+\s+)(scram-sha-256|md5)', '$1trust' | Set-Content $hba
          & "$pgBin\pg_ctl.exe" start -D "$pgData" -w -t 30
          & "$pgBin\psql.exe" -U postgres -c "ALTER USER postgres PASSWORD 'postgres';"
          & "$pgBin\psql.exe" -U postgres -c "CREATE DATABASE testdb;"
          (Get-Content $hba) -replace '(host\s+all\s+all\s+\S+\s+)trust', '$1scram-sha-256' | Set-Content $hba
          & "$pgBin\pg_ctl.exe" reload -D "$pgData"
        shell: pwsh

      - name: Build with Batch Script (Release)
        run: ./build.bat

      - name: Download Chinook SQLite Test Database
        run: |
          curl.exe -sSL -o Chinook_Sqlite.sqlite https://github.com/lerocha/chinook-database/releases/download/v1.4.5/Chinook_Sqlite.sqlite

      - name: Run SQLite Integration Tests (Batch Build)
        env:
          SQLITE_DB_PATH: ${{ github.workspace }}/Chinook_Sqlite.sqlite
        run: bin\mcp_test_runner_sqlite.exe bin\sqlite-mcp-server.exe

      - name: Run PostgreSQL Integration Tests (Batch Build)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: testdb
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bin\mcp_test_runner_postgres.exe bin\postgres-mcp-server.exe

      - name: Build with CMake (Release)
        run: |
          mkdir build-cmake
          cd build-cmake
          cmake ..
          cmake --build . --config Release

      - name: Run SQLite Integration Tests (CMake Release)
        env:
          SQLITE_DB_PATH: ${{ github.workspace }}/Chinook_Sqlite.sqlite
        run: .\build-cmake\Release\mcp_test_runner_sqlite.exe .\build-cmake\Release\sqlite-mcp-server.exe

      - name: Run PostgreSQL Integration Tests (CMake Release)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: testdb
          PGUSER: postgres
          PGPASSWORD: postgres
        run: .\build-cmake\Release\mcp_test_runner_postgres.exe .\build-cmake\Release\postgres-mcp-server.exe

      - name: Build with CMake (Debug - Build Only)
        run: |
          mkdir build-cmake-debug
          cd build-cmake-debug
          cmake ..
          cmake --build . --config Debug
