name: CI Build & Integration Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-linux:
    name: Build & Test Linux (64-bit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install libcurl (required by snowflake-mcp-server)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config

      - name: Build with Shell Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Download Chinook SQLite Test Database
        run: |
          curl -sSL -o Chinook_Sqlite.sqlite https://github.com/lerocha/chinook-database/releases/download/v1.4.5/Chinook_Sqlite.sqlite

      - name: Run Integration Tests on Chinook Database (Shell Build)
        env:
          SQLITE_DB_PATH: ${{ github.workspace }}/Chinook_Sqlite.sqlite
        run: |
          ./bin/mcp_test_runner_sqlite ./bin/sqlite-mcp-server

      - name: Run Integration Tests on PostgreSQL (Shell Build)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          ./bin/mcp_test_runner_postgres ./bin/postgres-mcp-server

      - name: Build with CMake (Release)
        run: |
          mkdir build-cmake
          cd build-cmake
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Run Integration Tests on Chinook Database (CMake Build)
        env:
          SQLITE_DB_PATH: ${{ github.workspace }}/Chinook_Sqlite.sqlite
        run: |
          ./build-cmake/mcp_test_runner_sqlite ./build-cmake/sqlite-mcp-server

      - name: Run Integration Tests on PostgreSQL (CMake Build)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          ./build-cmake/mcp_test_runner_postgres ./build-cmake/postgres-mcp-server

  build-windows:
    name: Build & Test Windows (64-bit MSVC)
    runs-on: windows-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Batch Script (Release)
        run: ./build.bat

      - name: Download Chinook SQLite Test Database
        run: |
          curl.exe -sSL -o Chinook_Sqlite.sqlite https://github.com/lerocha/chinook-database/releases/download/v1.4.5/Chinook_Sqlite.sqlite

      - name: Run Integration Tests on Chinook Database (Batch Build)
        env:
          SQLITE_DB_PATH: ${{ github.workspace }}/Chinook_Sqlite.sqlite
        run: bin\mcp_test_runner_sqlite.exe bin\sqlite-mcp-server.exe

      - name: Run Integration Tests on PostgreSQL (Batch Build)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bin\mcp_test_runner_postgres.exe bin\postgres-mcp-server.exe

      - name: Build with CMake (Release)
        run: |
          mkdir build-cmake
          cd build-cmake
          cmake ..
          cmake --build . --config Release

      - name: Run Integration Tests on Chinook Database (CMake Release)
        env:
          SQLITE_DB_PATH: ${{ github.workspace }}/Chinook_Sqlite.sqlite
        run: |
          .\build-cmake\Release\mcp_test_runner_sqlite.exe .\build-cmake\Release\sqlite-mcp-server.exe

      - name: Run Integration Tests on PostgreSQL (CMake Release)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          .\build-cmake\Release\mcp_test_runner_postgres.exe .\build-cmake\Release\postgres-mcp-server.exe

      - name: Build with CMake (Debug - Build Only)
        run: |
          mkdir build-cmake-debug
          cd build-cmake-debug
          cmake ..
          cmake --build . --config Debug
